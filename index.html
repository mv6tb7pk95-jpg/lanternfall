<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Lanternfall - pixelfx fire test</title>
<style>
  html,body{margin:0;min-height:100%;background:#0b0912;color:#f4ecd8;font-family:ui-monospace,Menlo,monospace}
  body{padding:14px 16px 28px;box-sizing:border-box}
  h1{margin:0 0 4px;color:#ffd27a;font-size:20px;letter-spacing:2px}
  #sub{margin:0 0 12px;color:#9d96b5;font-size:12px;line-height:1.5}
  #bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  #bar button{background:#1f1b33;color:#f4ecd8;border:2px solid #b8893a;border-radius:6px;padding:8px 12px;font:inherit;font-size:12px}
  #bar button.on{background:#b8893a;color:#0b0912}
  #stage{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end}
  figure{margin:0;text-align:center}
  figure canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#15121f;border:1px solid #2a2642}
  figcaption{margin-top:6px;font-size:12px;color:#ffd27a}
  #err{margin:14px 0 0;padding:10px;background:#3a0f14;border:2px solid #c94a4a;border-radius:6px;color:#ffd0d0;font-size:12px;white-space:pre-wrap;word-break:break-word}
  #credit{margin-top:22px;color:#6f6a85;font-size:10px;line-height:1.6}
</style>
</head>
<body>
<h1>LANTERNFALL</h1>
<p id="sub">pixelfx fire effects: campfire, brazier, torch, candle. The code is copied from github.com/patch-gg/pixelfx and loaded as ES modules.</p>
<div id="bar">
  <button id="pause">Pause</button>
  <button data-scale="2">2x</button>
  <button data-scale="3">3x</button>
  <button data-scale="4">4x</button>
</div>
<div id="stage"></div>
<pre id="err" hidden></pre>
<p id="credit">Effects: pixelfx (MIT). Fire recipes adapted from Sprite Fusion (MIT, Copyright (c) 2026 Hugo Duprez). See LICENSE-pixelfx.txt.</p>

<script>
(function () {
  var err = document.getElementById("err");
  function show(msg) { err.hidden = false; err.textContent += msg + "\n"; }
  window.__lfShow = show;
  window.addEventListener("error", function (e) {
    show("Error: " + (e.message || "a script failed") + (e.filename ? "\n  at " + e.filename + ":" + e.lineno : ""));
  });
  window.addEventListener("unhandledrejection", function (e) {
    show("Promise error: " + ((e.reason && e.reason.message) || e.reason));
  });
  if (location.protocol === "file:") {
    show("This page was opened from a file. ES modules do not load from file://. Open the GitHub Pages address instead.");
  }
  import("./src/main.js").catch(function (e) {
    show("Could not load src/main.js: " + ((e && e.message) || e));
  });
  setTimeout(function () {
    if (!window.__lfReady) show("Nothing has been drawn after 4 seconds. If no other message is shown above, wait for GitHub Pages to finish publishing and reload.");
  }, 4000);
})();
</script>
</body>
</html>
