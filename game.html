<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Lanternfall</title>
<style>
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:#07060d;color:#f4ecd8;font-family:ui-monospace,Menlo,Consolas,monospace;overflow:hidden;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #view{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}

  /* HUD */
  #hud{position:fixed;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));z-index:5;pointer-events:none;width:210px}
  .hp{height:16px;background:#000;border:2px solid #b8893a;position:relative}
  .hp i{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(#f06a6a,#b5302f)}
  .hp span{position:absolute;inset:0;text-align:center;line-height:16px;font-size:10px;font-weight:700;text-shadow:1px 1px 0 #000}
  .info{margin-top:6px;font-size:11px;text-shadow:1px 1px 0 #000;color:#ffd27a}

  /* skill buttons */
  #skills{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:5}
  #skills button{position:relative;width:76px;height:64px;background:#1f1b33;border:2px solid #b8893a;border-radius:6px;color:#f4ecd8;
    font:inherit;font-size:10px;box-shadow:0 3px 0 #000;overflow:hidden;touch-action:none;padding:0}
  #skills button:active{transform:translateY(2px)}
  #skills .key{position:absolute;top:3px;left:6px;color:#9d96b5;font-size:10px}
  #skills .nm{position:absolute;left:2px;right:2px;bottom:6px;text-align:center;line-height:1.15}
  #skills .cd{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(0,0,0,.65);pointer-events:none}

  /* on-screen pad */
  #pad{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:10px;z-index:5}
  #pad button{width:62px;height:62px;border-radius:50%;background:rgba(28,25,48,.85);border:2px solid #b8893a;color:#f4ecd8;
    font:inherit;font-size:12px;touch-action:none;padding:0}
  #pad button:active{background:rgba(70,60,110,.9)}
  #jumpWrap{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:5}
  #jumpWrap button{width:70px;height:70px;border-radius:50%;background:rgba(28,25,48,.85);border:2px solid #b8893a;color:#f4ecd8;
    font:inherit;font-size:12px;touch-action:none;padding:0}
  #jumpWrap button:active{background:rgba(70,60,110,.9)}

  /* class select / game over */
  #select,#over{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:14px;box-sizing:border-box;background:radial-gradient(ellipse at center,#2a2642,#0b0912)}
  #over{background:rgba(7,6,13,.88);z-index:11;gap:10px}
  h1{color:#ffd27a;font-size:28px;letter-spacing:4px;margin:0 0 6px;text-shadow:0 4px 0 #3a2a10;text-align:center}
  .sub{color:#9d96b5;font-size:12px;margin:0 0 18px;text-align:center}
  #cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;width:100%;max-width:920px}
  .card{background:#1f1b33;border:2px solid #b8893a;border-radius:8px;color:#f4ecd8;font:inherit;padding:14px 8px;box-shadow:0 4px 0 #000;text-align:center;touch-action:manipulation}
  .card:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
  .card b{display:block;color:#ffd27a;font-size:13px;margin-bottom:6px}
  .card small{display:block;color:#9d96b5;font-size:10px;line-height:1.5;margin-top:3px}
  #retry{background:#1f1b33;border:2px solid #b8893a;border-radius:8px;color:#f4ecd8;font:inherit;font-size:14px;padding:10px 22px;box-shadow:0 4px 0 #000}
  #overTxt{color:#ffd27a;font-size:16px}
  .help{margin-top:16px;color:#7d7796;font-size:10px;text-align:center;line-height:1.6}
  @media(max-width:760px){#cards{grid-template-columns:repeat(2,1fr)}}

  #status{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;background:rgba(28,25,48,.96);border:2px solid #b8893a;
    padding:10px 16px;border-radius:6px;font-size:12px}
  #err{position:fixed;left:8px;right:8px;top:8px;z-index:99;background:#5a0f14;color:#fff;border:2px solid #ff6a6a;border-radius:6px;
    padding:10px;font-size:11px;white-space:pre-wrap;word-break:break-word;max-height:60vh;overflow:auto;user-select:text;-webkit-user-select:text;touch-action:auto}
</style>
</head>
<body>

<div id="stage"><canvas id="view"></canvas></div>

<div id="hud">
  <div class="hp"><i id="hpFill"></i><span id="hpTxt"></span></div>
  <div class="info">WAVE <span id="wave">0</span> &nbsp;·&nbsp; KILLS <span id="kills">0</span></div>
</div>

<div id="skills"></div>

<div id="pad">
  <button data-pad="left" aria-label="Move left">◀</button>
  <button data-pad="right" aria-label="Move right">▶</button>
</div>
<div id="jumpWrap"><button data-pad="jump" aria-label="Jump">JUMP</button></div>

<div id="select">
  <h1>LANTERNFALL</h1>
  <p class="sub">Choose your lantern-bearer</p>
  <div id="cards"></div>
  <div class="help">Keyboard: ← → or A D move · Space jump · 1 2 3 skills<br>iPad: use the on-screen buttons</div>
</div>

<div id="over" hidden>
  <h1>YOU FELL</h1>
  <div id="overTxt"></div>
  <button id="retry">PLAY AGAIN</button>
</div>

<div id="status" hidden></div>

<!-- Error display. main.js calls window.__lfShow(message) for any failure. -->
<script>
  window.__lfShow = function (msg) {
    var box = document.getElementById("err");
    if (!box) {
      box = document.createElement("div");
      box.id = "err";
      document.body.appendChild(box);
    }
    box.textContent = (box.textContent ? box.textContent + "\n\n" : "") + msg;
    var s = document.getElementById("status");
    if (s) s.hidden = true;
  };
  window.addEventListener("error", function (e) {
    window.__lfShow("Error: " + e.message + (e.filename ? "\n" + e.filename + ":" + e.lineno : ""));
  });
  window.addEventListener("unhandledrejection", function (e) {
    window.__lfShow("Error: " + ((e.reason && (e.reason.stack || e.reason.message)) || e.reason));
  });
</script>

<script type="module">
  // Dynamic import so a failed module load (a typo, a missing file, no internet for jsDelivr) shows in the red box.
  import("./src/game/main.js").catch(function (e) {
    window.__lfShow("Could not load src/game/main.js\n" + ((e && (e.stack || e.message)) || e));
  });
</script>

</body>
</html>
